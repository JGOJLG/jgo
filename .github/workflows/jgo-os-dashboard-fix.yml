name: Apply JGO OS dashboard fixes

on:
  push:
    paths:
      - '.github/workflows/jgo-os-dashboard-fix.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch JGO OS
        shell: bash
        run: |
          echo '
' | base64 -d | python

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/CalendarScheduler.tsx 'app/clients/[id]/ClientActions.tsx' app/api/invoices/send/route.ts
          git commit -m "Fix dashboard meetings client editing and invoices"
          git push

name: Apply JGO OS dashboard fixes

on:
  push:
    paths:
      - '.github/workflows/jgo-os-dashboard-fix.yml'

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch JGO OS
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # 1) Dashboard: replace People to Reach Out To with Upcoming Meetings.
          page = Path('app/page.tsx')
          text = page.read_text()

          old_data = '''  const peopleToReachOutTo = leadClients
    .filter(
      (client) =>
        normalize(client.follow_up_status) === "needs follow-up"
    )
    .map((client) => ({
      key: `lead-client-${client.id}`,
      name: client.name || "Unnamed Lead",
      label: client.next_step || "Follow-up needed",
      date: client.due_date,
      priority: "Normal",
      href: `/clients/${client.id}`,
      overdue: Boolean(client.due_date && client.due_date < today),
    }))
    .sort((a, b) => {
      if (a.overdue && !b.overdue) return -1;
      if (!a.overdue && b.overdue) return 1;

      return (a.date || "9999-12-31").localeCompare(
        b.date || "9999-12-31"
      );
    })
    .slice(0, 7);'''

          new_data = '''  const upcomingMeetings = activeCalendarEvents
    .filter((event) => {
      if (!event.client_id || !event.start_at) return false;

      const eventType = normalize(event.event_type);
      const isMeeting = ["free 15", "coaching session", "appointment"].includes(
        eventType
      );

      return isMeeting && new Date(event.start_at).getTime() >= Date.now();
    })
    .sort((a, b) => (a.start_at || "").localeCompare(b.start_at || ""))
    .slice(0, 7);'''

          if old_data not in text:
              raise SystemExit('Dashboard data block not found')
          text = text.replace(old_data, new_data, 1)

          old_ui = '''          <div className="rounded-[28px] border border-white/70 bg-[#eaf0e5]/72 p-6 shadow-[0_22px_60px_rgba(71,91,66,0.12)] backdrop-blur-2xl transition hover:-translate-y-0.5 hover:bg-[#eaf0e5]/88 lg:p-7">
            <div className="flex items-start justify-between gap-4">
              <div>
                <p className="text-xs font-semibold uppercase tracking-[0.18em] text-[#6f8966]">
                  Priority
                </p>
                <h3 className="mt-2 text-2xl font-bold text-[#243128]">
                  People to Reach Out To
                </h3>
                <p className="mt-1 text-sm text-[#637166]">
                  Leads and clients who need a response.
                </p>
              </div>
              <Link href="/follow-ups" className="shrink-0 text-sm font-semibold text-[#4d6247]">
                View all
              </Link>
            </div>

            {peopleToReachOutTo.length === 0 ? (
              <div className="mt-6 rounded-2xl border border-[#d2ddcd] bg-white/70 p-6 text-center">
                <p className="text-sm font-semibold text-[#3d4d39]">You are all caught up</p>
                <p className="mt-2 text-sm text-[#708075]">No open outreach items right now.</p>
              </div>
            ) : (
              <div className="mt-6 space-y-3">
                {peopleToReachOutTo.map((person) => (
                  <Link
                    key={person.key}
                    href={person.href}
                    className="flex items-center justify-between gap-4 rounded-2xl border border-[#d8e1d3] bg-white px-4 py-4 transition hover:border-[#bdcdb7]"
                  >
                    <div className="min-w-0">
                      <p className="truncate text-sm font-bold text-[#243128]">{person.name}</p>
                      <p className="mt-1 truncate text-xs text-[#708075]">{person.label}</p>
                    </div>
                    <div className="flex shrink-0 flex-col items-end gap-1.5">
                      <span
                        className={`rounded-full px-2.5 py-1 text-[11px] font-semibold ${
                          person.overdue
                            ? "bg-[#f7e7e4] text-[#9a554d]"
                            : getFollowUpStyle(person.priority)
                        }`}
                      >
                        {person.overdue ? "Overdue" : "Reach out"}
                      </span>
                      <span className="text-[11px] text-[#7d897f]">{formatDate(person.date)}</span>
                    </div>
                  </Link>
                ))}
              </div>
            )}
          </div>'''

          new_ui = '''          <div className="rounded-[28px] border border-white/70 bg-[#eaf0e5]/72 p-6 shadow-[0_22px_60px_rgba(71,91,66,0.12)] backdrop-blur-2xl transition hover:-translate-y-0.5 hover:bg-[#eaf0e5]/88 lg:p-7">
            <div className="flex items-start justify-between gap-4">
              <div>
                <p className="text-xs font-semibold uppercase tracking-[0.18em] text-[#6f8966]">
                  Calendar
                </p>
                <h3 className="mt-2 text-2xl font-bold text-[#243128]">
                  Upcoming Meetings
                </h3>
                <p className="mt-1 text-sm text-[#637166]">
                  Free 15s and coaching sessions coming up.
                </p>
              </div>
              <Link href="/calendar" className="shrink-0 text-sm font-semibold text-[#4d6247]">
                View calendar
              </Link>
            </div>

            {upcomingMeetings.length === 0 ? (
              <div className="mt-6 rounded-2xl border border-[#d2ddcd] bg-white/70 p-6 text-center">
                <p className="text-sm font-semibold text-[#3d4d39]">No upcoming meetings</p>
                <p className="mt-2 text-sm text-[#708075]">Meetings scheduled from a client profile will appear here.</p>
              </div>
            ) : (
              <div className="mt-6 space-y-3">
                {upcomingMeetings.map((meeting) => {
                  const clientName = meeting.client_id
                    ? clientNameById.get(meeting.client_id) || "Client"
                    : "Client";

                  return (
                    <Link
                      key={meeting.id}
                      href={`/clients/${meeting.client_id}`}
                      className="flex items-center justify-between gap-4 rounded-2xl border border-[#d8e1d3] bg-white px-4 py-4 transition hover:border-[#bdcdb7]"
                    >
                      <div className="min-w-0">
                        <p className="truncate text-sm font-bold text-[#243128]">{clientName}</p>
                        <p className="mt-1 truncate text-xs text-[#708075]">
                          {meeting.title || formatEventType(meeting.event_type)}
                        </p>
                      </div>
                      <div className="flex shrink-0 flex-col items-end gap-1.5">
                        <span className="rounded-full bg-[#eef2e9] px-2.5 py-1 text-[11px] font-semibold text-[#5c7454]">
                          {formatTime(meeting.start_at) || "Time not added"}
                        </span>
                        <span className="text-[11px] text-[#7d897f]">{formatDate(meeting.start_at)}</span>
                      </div>
                    </Link>
                  );
                })}
              </div>
            )}
          </div>'''

          if old_ui not in text:
              raise SystemExit('Dashboard UI block not found')
          text = text.replace(old_ui, new_ui, 1)
          page.write_text(text)

          # 2) Scheduler: allow a real time for Free 15 and Coaching Session too.
          scheduler = Path('components/CalendarScheduler.tsx')
          text = scheduler.read_text()
          old = '''                {eventType === "Client Interview" ? (
                  <>
                    <div>
                      <label className="text-xs font-semibold uppercase tracking-wide text-[#708075]">
                        Time
                      </label>
                      <select
                        name="eventTime"
                        defaultValue=""
                        className="mt-1 w-full rounded-xl border border-[#dfe6db] px-3 py-2 text-sm text-[#243128] outline-none focus:border-[#7f9975]"
                      >
                        <option value="">Select time</option>
                        {TIME_OPTIONS.map((t) => (
                          <option key={t.value} value={t.value}>
                            {t.label}
                          </option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="text-xs font-semibold uppercase tracking-wide text-[#708075]">
                        Notes
                      </label>
                      <textarea
                        name="notes"
                        rows={3}
                        placeholder="Interview details..."
                        className="mt-1 w-full rounded-xl border border-[#dfe6db] px-3 py-2 text-sm text-[#243128] outline-none focus:border-[#7f9975]"
                      />
                    </div>
                  </>
                ) : null}'''

          new = '''                {["Client Interview", "Free 15", "Coaching Session"].includes(eventType) ? (
                  <div>
                    <label className="text-xs font-semibold uppercase tracking-wide text-[#708075]">
                      Time
                    </label>
                    <select
                      name="eventTime"
                      required
                      defaultValue=""
                      className="mt-1 w-full rounded-xl border border-[#dfe6db] px-3 py-2 text-sm text-[#243128] outline-none focus:border-[#7f9975]"
                    >
                      <option value="">Select time</option>
                      {TIME_OPTIONS.map((t) => (
                        <option key={t.value} value={t.value}>
                          {t.label}
                        </option>
                      ))}
                    </select>
                  </div>
                ) : null}

                {eventType === "Client Interview" ? (
                  <div>
                    <label className="text-xs font-semibold uppercase tracking-wide text-[#708075]">
                      Notes
                    </label>
                    <textarea
                      name="notes"
                      rows={3}
                      placeholder="Interview details..."
                      className="mt-1 w-full rounded-xl border border-[#dfe6db] px-3 py-2 text-sm text-[#243128] outline-none focus:border-[#7f9975]"
                    />
                  </div>
                ) : null}'''

          if old not in text:
              raise SystemExit('Scheduler time block not found')
          scheduler.write_text(text.replace(old, new, 1))

          # 3) Client profile actions: expose existing Edit Client page.
          actions = Path('app/clients/[id]/ClientActions.tsx')
          text = actions.read_text()
          if 'import Link from "next/link";' not in text:
              text = text.replace('"use client";\n', '"use client";\n\nimport Link from "next/link";\n', 1)

          marker = '''  return (
    <>
      {isArchived ? ('''
          replacement = '''  return (
    <>
      <Link
        href={`/clients/${clientId}/edit`}
        className="rounded-xl border border-[#cbd8c4] bg-white px-5 py-3 text-sm font-semibold text-[#4d6247] hover:bg-[#f5f7f2]"
      >
        Edit Client Profile
      </Link>

      {isArchived ? ('''
          if marker not in text:
              raise SystemExit('ClientActions insertion point not found')
          actions.write_text(text.replace(marker, replacement, 1))

          # 4) Invoice: fix lowercase API route expected by the client button.
          route = Path('app/api/invoices/send/route.ts')
          route.parent.mkdir(parents=True, exist_ok=True)
          route.write_text('''export { POST, runtime, dynamic } from "@/app/API/invoices/send/route";\n''')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/CalendarScheduler.tsx 'app/clients/[id]/ClientActions.tsx' app/api/invoices/send/route.ts
          git commit -m "Fix dashboard meetings client editing and invoices"
          git push
